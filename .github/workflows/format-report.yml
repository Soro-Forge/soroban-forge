name: Format report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: never

jobs:
  report:
    name: report rustfmt diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Collect rustfmt diff
        id: fmt
        run: |
          set +e
          cargo fmt --all -- --check > fmt.diff 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment the diff on the pull request
        if: steps.fmt.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### rustfmt"
            echo
            echo "\`cargo fmt --all -- --check\` wants the following changes."
            echo
            echo '```diff'
            head -c 55000 fmt.diff
            echo '```'
          } > body.md
          gh pr comment "$PR_NUMBER" --body-file body.md
